<!DOCTYPE html>
<html lang="th" data-brand="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Farm Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fff;--card:#fff;--muted:#f4f4f5;--fg:#18181b;--mfg:#71717a;--bd:#e4e4e7;
  --brand:#18181b;--s1:#18181b;--s2:#3a3a40;--c1:#3b82f6;--c2:#22a860;--c3:#e9b72a;--red:#ef4444;--onbrand:#fff;
  --page:#f4f4f5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--card:#1a1a1f;--muted:#131316;--fg:#f4f4f5;--mfg:#a1a1aa;--bd:#2a2a31;--page:#0a0a0c;--brand:#ececee;--onbrand:#18181b;--s1:#2a2a2f;--s2:#1d1d21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e11;--card:#1a1a1f;--muted:#131316;--fg:#f4f4f5;--mfg:#a1a1aa;--bd:#2a2a31;--page:#0a0a0c;--brand:#ececee;--onbrand:#18181b;--s1:#2a2a2f;--s2:#1d1d21;color-scheme:dark}
:root[data-brand="blue"]{--brand:#2f6feb;--s1:#2f6feb;--s2:#5b8def;--onbrand:#fff}
:root[data-brand="teal"]{--brand:#14a39a;--s1:#14a39a;--s2:#3cc4b8;--onbrand:#fff}
:root[data-brand="orange"]{--brand:#f08a1c;--s1:#f08a1c;--s2:#f6a94d;--onbrand:#fff}
:root[data-brand="pink"]{--brand:#e0589f;--s1:#e0589f;--s2:#ee86bd;--onbrand:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.shell{max-width:1500px;margin:0 auto;padding:12px}
.frame{display:flex;height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px var(--bd)}
aside{width:208px;background:linear-gradient(to bottom,var(--s1),var(--s2));color:#fff;display:flex;flex-direction:column;border-radius:24px 0 0 24px;transition:width .3s;flex:none}
aside.c{width:78px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.logo i{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal}
.ibtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 8px}
nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:rgba(255,255,255,.9);text-decoration:none}
nav a:hover{background:rgba(255,255,255,.1)}
nav a.on{background:#f4f4f5;color:#18181b}
aside.c .t,aside.c .logo span,aside.c .tip{display:none}
.tip{margin:8px 12px 20px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px;font-size:.78rem}
main{flex:1;min-width:0;background:var(--muted);overflow:auto;padding:0 28px 24px;border-radius:0 24px 24px 0}
.top{position:sticky;top:0;z-index:20;margin:0 -28px 22px;padding:0 28px;height:64px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--muted) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:9px 14px 9px 38px}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mfg)}
.menu{display:none}
.tb{position:relative;border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem}
.tb:hover{background:var(--bd)}
.badge{position:absolute;top:2px;right:0;background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.av{width:34px;height:34px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:.8rem;font-weight:500}
.pop{position:absolute;right:0;top:46px;width:250px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.15)}
.pop h4{margin:6px 8px;font-size:.8rem;color:var(--mfg);font-weight:500}
.pop button.it,.pop a.it{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:.85rem}
.pop .it:hover{background:var(--muted)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;border:0;background:var(--bd);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:#18181b}
.seg{display:flex;background:var(--muted);border-radius:10px;padding:3px;gap:2px;margin-top:6px}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:.75rem;color:var(--mfg)}.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--bd)}
.dots{display:flex;gap:8px;margin-top:6px}
.dots button{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);box-shadow:0 0 0 2px transparent}
.dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--mfg)}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 0 0 1px var(--bd);min-width:0}
.card h2,.card h3{margin:0;font-size:.88rem;font-weight:600}
.sub{color:var(--mfg);font-size:.75rem}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stack>*+*{margin-top:20px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gz{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.welcome{background:linear-gradient(135deg,var(--s1),var(--s2));color:#fff;border-radius:24px;padding:24px;display:flex;gap:16px;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.welcome h1{margin:0;font-size:1.9rem;font-weight:600}
.welcome p{opacity:.9;line-height:1.7;margin:8px 0 0}
.wbox{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;margin-top:16px;width:fit-content}
.wbox b{font-size:1.6rem;font-weight:400}
.welcome svg{width:min(360px,40%);flex:none}
.zone{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--bd)}
.zone .r{display:flex;align-items:center;gap:8px}
.zi{width:32px;height:32px;border-radius:12px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-size:.95rem}
.bar{height:6px;background:var(--muted);border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.warn{color:var(--red)}
.dev{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--bd)}
.dev .r{display:flex;justify-content:space-between;align-items:center}
.dev .ic{font-size:1.4rem}
.scn{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--bd);width:100%;text-align:left;border:0}
.scn .ic{font-size:1.4rem}
.big{font-size:1.9rem;font-weight:700;color:var(--brand);margin-top:6px}
.vbar{width:8px;height:96px;background:var(--muted);border-radius:99px;position:relative;margin-top:14px}
.vbar i{position:absolute;bottom:0;width:8px;background:var(--brand);border-radius:99px;transition:height .3s}
.chip{background:var(--muted);border-radius:99px;padding:4px 12px;font-size:.8rem}
input[type=range]{width:100%;accent-color:var(--brand)}
.irr{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.btns button{border:0;border-radius:12px;background:var(--muted);padding:8px;font-size:.82rem}
.btns button.p{background:var(--brand);color:var(--onbrand)}
svg text{fill:var(--mfg);font-family:inherit}
.lg{display:flex;gap:14px;justify-content:center;font-size:.75rem;color:var(--mfg);margin-top:6px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.page{padding:26px}
.page h1{margin:0;font-size:1.5rem;font-weight:600}
.page>p{color:var(--mfg);margin:6px 0 22px}
.inner{background:var(--muted);border-radius:12px;padding:14px;box-shadow:0 0 0 1px var(--bd)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--bd)}
.list li:first-child{border-top:0}
.list .av{flex:none}
.tag{background:var(--muted);border-radius:99px;padding:3px 10px;font-size:.72rem}
.ev{display:flex;justify-content:space-between;padding:6px 0;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.ov{display:none}
@media (max-width:1100px){.g3{grid-template-columns:1fr}.gz{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .shell{padding:0}
  .frame{border-radius:0;height:100vh;height:100dvh;box-shadow:none}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .3s;width:230px;border-radius:0 24px 24px 0;padding-top:env(safe-area-inset-top,0px)}
  aside.c{width:230px}aside.c .t,aside.c .logo span,aside.c .tip{display:revert}
  aside.mo{transform:none}
  .ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  main{padding:0 14px 20px;border-radius:0}
  .top{margin:0 -14px 16px;padding:0 14px}
  .menu{display:grid}
  .hidem{display:none}
  .welcome{flex-direction:column;align-items:flex-start}.welcome svg{width:100%}
  .g2,.irr{grid-template-columns:1fr}
  .page{padding:18px}
}
@media (max-width:520px){.gz{grid-template-columns:repeat(2,1fr)}.welcome h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.manage-scroll{overflow-x:auto}.manage-table{width:100%;border-collapse:collapse;text-align:left;min-width:470px}.manage-table th,.manage-table td{padding:12px 9px;border-bottom:1px solid var(--bd)}.manage-table button,.manage-actions button{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 12px}.manage-primary{background:var(--brand)!important;color:var(--onbrand)!important;border:0!important;border-radius:10px;padding:9px 15px;cursor:pointer}.manage-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:grid;place-items:center;padding:16px}.manage-dialog{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--card);padding:24px;border-radius:18px;display:grid;gap:14px}.manage-dialog h2{margin:0}.manage-field{display:grid;gap:6px}.manage-field input,.manage-field select{width:100%;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--fg);padding:10px}.manage-actions{display:flex;justify-content:flex-end;gap:10px}

/* Working hamburger toggle on desktop and mobile */
.top .menu{display:grid;flex:none;border:1px solid var(--bd);border-radius:11px;background:var(--card);font-size:19px;transition:background .2s,transform .2s}
.top .menu:hover{background:var(--bd)}
.top .menu:active{transform:scale(.94)}
/* Refined Smart Farm sidebar */
aside{width:244px;background:linear-gradient(165deg,#22242d 0%,#17191f 100%);border-right:1px solid rgba(255,255,255,.07)}
aside.c{width:84px}
.brandrow{min-height:88px;padding:18px 14px;gap:10px}
.logo{min-width:0;gap:11px;white-space:nowrap;font-size:15px;letter-spacing:.1px}
.logo i{flex:none;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#41454e,#2b2e36);font-size:22px;box-shadow:inset 0 1px rgba(255,255,255,.1)}
.logo span{overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:30px;height:32px;padding:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:#343740;border-radius:10px;font-size:18px;transition:background .2s}
.ibtn:hover{background:#454a55}
aside nav{padding:10px 12px;gap:7px;overflow-x:hidden}
aside nav a{min-height:48px;padding:0 14px;gap:14px;border-radius:13px;white-space:nowrap;font-weight:500;transition:background .2s,transform .2s;color:#c7cbd4}
aside nav a>span:first-child{width:25px;min-width:25px;display:grid;place-items:center;font-size:19px;line-height:1.3}
aside nav a:hover{background:rgba(255,255,255,.09);color:white}
aside nav a.on{background:#f5f6f8;color:#171a20;box-shadow:0 4px 14px rgba(0,0,0,.16)}
aside.c .brandrow{flex-direction:column;justify-content:center;gap:12px;padding:16px 8px 12px;min-height:116px}
aside.c .logo{justify-content:center;width:100%}
aside.c .logo i{width:46px;height:46px}
aside.c .ibtn{width:36px;height:28px;font-size:16px}
aside.c nav{padding:8px 10px;align-items:stretch}
aside.c nav a{width:64px;height:54px;min-height:54px;padding:0;justify-content:center;margin:0 auto;border-radius:14px}
aside.c nav a>span:first-child{font-size:22px;width:30px;min-width:30px}
aside.c .tip{display:none}
@media(max-width:860px){
 aside,aside.c{width:244px}
 aside.c .brandrow{flex-direction:row;justify-content:space-between;min-height:88px;padding:18px 14px}
 aside.c .logo{width:auto;justify-content:flex-start}
 aside.c nav{padding:10px 12px}
 aside.c nav a{width:auto;height:48px;min-height:48px;justify-content:flex-start;padding:0 14px;margin:0}
 aside.c nav a>span:first-child{font-size:19px;width:25px;min-width:25px}
}
aside.c .brandrow{justify-content:center}

/* Motion: only animate page entry, not realtime database refreshes. */
@media (prefers-reduced-motion: no-preference){
 @keyframes sf-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
 @keyframes sf-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
 @keyframes sf-dialog{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
 @keyframes sf-fade{from{opacity:0}to{opacity:1}}
 #page.sf-enter{animation:sf-enter .32s cubic-bezier(.2,.75,.25,1) both}
 .pop{animation:sf-pop .2s ease-out both;transform-origin:top right}
 .manage-overlay{animation:sf-fade .18s ease-out both}
 .manage-dialog{animation:sf-dialog .28s cubic-bezier(.2,.75,.25,1) both}
 .card,.zone,.dev,.inner,.scn{transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
 .sw,.tb,.btns button,.manage-primary,.manage-table button{transition:transform .16s ease,background .2s ease,box-shadow .2s ease}
 button:active:not(.sw){transform:scale(.96)}
 .sw:active{transform:scale(.93)}
 .bar i,#garc{transition:width .4s ease,stroke-dashoffset .35s ease}
 @media(hover:hover) and (pointer:fine){
  .zone:hover,.dev:hover,.scn:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.13),0 0 0 1px var(--bd)}
  aside nav a:hover{transform:translateX(3px)}
  aside.c nav a:hover{transform:translateY(-2px)}
  .manage-primary:hover,.btns button:hover{filter:brightness(1.1)}
 }
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Continuous sidebar motion: keep labels mounted while collapsing. */
aside{overflow:hidden;transition:width .42s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1)}
@media(min-width:861px){
 aside .brandrow,aside.c .brandrow{min-height:88px;padding:18px 14px;flex-direction:row;justify-content:flex-start}
 aside .logo,aside.c .logo{justify-content:flex-start;width:100%;gap:11px}
 aside .logo i,aside.c .logo i{width:44px;height:44px}
 aside nav,aside.c nav{padding:10px 12px;align-items:stretch}
 aside nav a,aside.c nav a{width:100%;height:48px;min-height:48px;margin:0;padding:0 14px;justify-content:flex-start;gap:14px;transition:background .2s,transform .2s,padding .42s cubic-bezier(.22,1,.36,1)}
 aside.c nav a{padding-left:17px;padding-right:0}
 aside nav a>span:first-child,aside.c nav a>span:first-child{width:25px;min-width:25px;font-size:19px}
 aside .t,aside .logo span,aside .tip,aside.c .t,aside.c .logo span,aside.c .tip{display:block;white-space:nowrap;opacity:1;transform:translateX(0);transition:opacity .24s ease,transform .35s ease;overflow:hidden}
 aside.c .t,aside.c .logo span,aside.c .tip{opacity:0;transform:translateX(-10px);pointer-events:none}
 aside .t,aside .logo span{flex:none}
}
@media(max-width:860px){.ov,.ov.on{display:block;opacity:0;visibility:hidden;pointer-events:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;transition:opacity .35s ease,visibility .35s}.ov.on{opacity:1;visibility:visible;pointer-events:auto}}
@media(prefers-reduced-motion:reduce){aside,aside *, .ov{transition:none!important}}

.firebase-settings{padding:10px 8px;border-top:1px solid var(--bd);margin-top:8px}.firebase-settings input{width:100%;min-width:0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:9px;margin:8px 0;font-size:12px}.firebase-settings button{width:100%;border:0;border-radius:8px;background:var(--brand);color:var(--onbrand);padding:9px}.firebase-settings .sub{overflow-wrap:anywhere}.pop:has(.firebase-settings){width:min(340px,85vw)}
/* Single authoritative sidebar motion */
#side{overflow:hidden;transition:width 480ms cubic-bezier(.4,0,.2,1),transform 480ms cubic-bezier(.4,0,.2,1)!important}
@media(min-width:861px){
#side{width:244px;flex:0 0 auto;min-width:0}
#side.c{width:84px}
#side .brandrow,#side.c .brandrow{padding:18px 19px;min-height:88px;justify-content:flex-start}

#side nav a,#side.c nav a{padding:0 17px;gap:14px;height:48px;min-height:48px;justify-content:flex-start}
#side .t,#side .logo span,#side .tip{display:block!important;white-space:nowrap;opacity:1;transform:translateX(0);transition:opacity 280ms ease,transform 400ms ease!important}
#side.c .t,#side.c .logo span,#side.c .tip{opacity:0;transform:translateX(-12px)}
main{scrollbar-gutter:stable}
}
@media(max-width:860px){#side{width:230px;transform:translateX(-100%)}#side.mo{transform:translateX(0)}.ov,.ov.on{transition:opacity 480ms ease,visibility 480ms!important}}

/* Overlay drawer: dashboard keeps its full width. */
.frame{position:relative;isolation:isolate}
#side,#side.c{position:absolute;top:0;bottom:0;left:0;width:min(260px,85vw);min-width:0;z-index:50;transform:translate3d(-105%,0,0);visibility:hidden;pointer-events:none;border-radius:24px 18px 18px 24px;box-shadow:12px 0 40px #0004;transition:transform .36s cubic-bezier(.22,1,.36,1),visibility 0s linear .36s!important}
#side.mo{transform:translate3d(0,0,0);visibility:visible;pointer-events:auto;transition:transform .36s cubic-bezier(.22,1,.36,1),visibility 0s!important}
#ov,#ov.on{display:block;position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.24);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .36s ease,visibility 0s linear .36s!important}
#ov.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .36s ease,visibility 0s!important}
#main{width:100%;min-width:0;border-radius:inherit}
#top .menu{display:grid}
#side .brandrow{justify-content:space-between}
#side .drawer-close{flex:none;background:#ffffff15;color:white;border:0;border-radius:10px;width:34px;height:34px;font-size:22px;line-height:1}
#side .logo{min-width:0;width:auto}
@media(max-width:860px){#side{border-radius:0 18px 18px 0}}

/* Drawer motion: fixed layout, reversible compositor transitions. */

var VIEW={manage:pManage,dashboard:pDash,devices:pDevices,messages:pMsg,statistics:pStat,security:pSec,profile:pProf};

var motionRoute=null;
function render(focusK){
  renderSide();renderTop();
  var main=$("main"),st=main.scrollTop;
  var currentRoute=route(), pageEl=$("page");
  var template=document.createElement('template');
  template.innerHTML=VIEW[currentRoute]();
  function patch(parent, fresh){
    var i=0;
    while(i<fresh.childNodes.length){
      var n=fresh.childNodes[i], o=parent.childNodes[i];
      if(!o){parent.appendChild(n.cloneNode(true));i++;continue;}
      if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName||(o.nodeType===1&&o.getAttribute('data-k')!==n.getAttribute('data-k'))){parent.replaceChild(n.cloneNode(true),o);i++;continue;}
      if(o.nodeType===3){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;}
      else if(o.nodeType===1){
        Array.from(o.attributes).forEach(function(a){if(!n.hasAttribute(a.name))o.removeAttribute(a.name)});
        Array.from(n.attributes).forEach(function(a){if(o.getAttribute(a.name)!==a.value)o.setAttribute(a.name,a.value)});
        patch(o,n);
      } i++;
    }
    while(parent.childNodes.length>fresh.childNodes.length)parent.lastChild.remove();
  }
  if(motionRoute===currentRoute)patch(pageEl,template.content);else pageEl.replaceChildren(template.content);
  if(motionRoute!==currentRoute){motionRoute=currentRoute;pageEl.classList.remove("sf-enter");void pageEl.offsetWidth;pageEl.classList.add("sf-enter");}
  main.scrollTop=st;
  if(focusK){var e=document.querySelector('[data-k="'+focusK+'"]');if(e)e.focus({preventScroll:true})}
  var q=$("q");if(q&&S.qf){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-k]"),k=b&&b.dataset.k;
  if(!b){if(S.menu&&!e.target.closest(".pop")){S.menu=null;renderTop()}if(S.mob&&(e.target.id==="ov"||e.target.closest("#side nav a"))){S.mob=false;renderSide()}return}
  S.qf=false;
  if(k==="col"){S.col=!S.col;render(k);return}
  if(k==="mob"){S.col=false;S.mob=!S.mob;S.menu=null;renderSide();renderTop();if(S.mob){var close=$('side').querySelector('.drawer-close');if(close)close.focus({preventScroll:true})}else{var toggle=$('top').querySelector('[data-k="mob"]');if(toggle)toggle.focus({preventScroll:true})}return}
  if(k.indexOf("m:")===0){var m=k.slice(2);S.menu=S.menu===m?null:m;renderTop();var n=document.querySelector('[data-k="'+k+'"]');if(n)n.focus();return}
  if(k==="theme"){mode=dark?"light":"dark";saveMode();applyTheme();renderTop();return}
  if(k.indexOf("tm:")===0){mode=k.slice(3);saveMode();applyTheme();renderTop();return}
  if(k.indexOf("b:")===0){document.documentElement.setAttribute("data-brand",k.slice(2));renderTop();return}
  if(k==="cancel-editor"){var md=$("farm-modal");if(md)md.remove();return}
  if(k.indexOf("add:")===0){farmEditor(k.slice(4),-1);return}
  if(k.indexOf("edit:")===0){var x=k.slice(5).split(":");farmEditor(x[0],Number(x[1]));return}
  if(k.indexOf("del:")===0){var x=k.slice(4).split(":");farmDelete(x[0],Number(x[1]));return}
  if(k==="firebase"){farmSetup();return}
  if(k==="out"){farmAuth.signOut().catch(function(){toast("ออกจากระบบไม่สำเร็จ")});return}
  if(k.indexOf("go:")===0){location.hash=k.slice(3);return}
  if(k.indexOf("sc:")===0){toast("เริ่มโหมด: "+k.slice(3));return}
  if(k==="boost"){toast("สั่งรดน้ำทันที 10 วินาที");return}
  var v,t=k.slice(2);
  if(k==="clim")S.clim=!S.clim;
  else if(k.indexOf("z:")===0){v=S.zones[+t];v.on=!v.on;toast(v.n+": "+(v.on?"เปิด":"ปิด")+"ระบบรดน้ำ")}
  else if(k.indexOf("p:")===0){v=S.pop[+t];v.on=!v.on}
  else if(k.indexOf("d:")===0){v=S.devs[+t];v.on=!v.on;toast(v.n+" "+v.z+": "+(v.on?"เปิด":"ปิด"))}
  else if(k.indexOf("s:")===0)S.sec[t]=!S.sec[t];
  else if(k.indexOf("f:")===0)S.prof[t]=!S.prof[t];
  else return;
  render(k);farmSave();
});

  if(e.target.id==="irr"){S.irr=+e.target.value;var r=85,c=2*Math.PI*r,a=270/360*c;$("garc").setAttribute("stroke-dashoffset",a-S.irr/100*a);$("gtxt").textContent=S.irr+"%";farmSave()}
  if(e.target.id==="q"){S.q=e.target.value;S.qf=true;var p=route();if(p==="dashboard"||p==="devices"){$("page").innerHTML=VIEW[p]()}}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&(S.menu||S.mob)){S.menu=null;S.mob=false;render()}});
window.addEventListener("hashchange",function(){S.mob=false;S.menu=null;S.q="";render();$("main").scrollTop=0});

try{farmApp=firebase.initializeApp(firebaseConfig);farmAuth=farmApp.auth();

$("loginForm").onsubmit=async function(e){e.preventDefault();$("loginSubmit").disabled=true;$("loginSubmit").classList.add("busy");$("loginMsg").textContent="กำลังเข้าสู่ระบบ...";try{await farmAuth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value);$("loginPassword").value=""}catch(err){var card=$("loginForm");card.classList.remove("loginError");void card.offsetWidth;card.classList.add("loginError");$("loginMsg").textContent="เข้าสู่ระบบไม่สำเร็จ: ตรวจสอบอีเมล รหัสผ่าน และการตั้งค่า Firebase"}finally{$("loginSubmit").classList.remove("busy");$("loginSubmit").disabled=false}};
farmAuth.onAuthStateChanged(function(user){if(user){if(activeUser===user.uid)return;activeUser=user.uid;var gate=$("loginGate");gate.classList.add("leaving");setTimeout(function(){if(activeUser!==user.uid)return;gate.hidden=true;document.querySelector(".shell").hidden=false;farmConnect()},window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:430)}else{clearTimeout(farmTimer);farmReady=false;if(farmDb)farmDb.ref('smartfarm/dashboard').off();if(activeUser){location.reload();return}$("loginGate").hidden=false;document.querySelector(".shell").hidden=true;$("loginSubmit").disabled=false;$("loginMsg").textContent=""}});
}).catch(function(e){$("loginMsg").textContent="ตั้งค่าการเข้าสู่ระบบไม่สำเร็จ: "+e.message});}catch(e){$("loginMsg").textContent="โหลด Firebase ไม่สำเร็จ: "+e.message}

})();
</script>
